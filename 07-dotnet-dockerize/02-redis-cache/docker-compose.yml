services:
  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - lab-network

  dotnet-api:
    build:
      context: ./Api
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__Redis=redis-cache:6379
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis-cache
    networks:
      - lab-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dotnet-api:
        condition: service_healthy
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge