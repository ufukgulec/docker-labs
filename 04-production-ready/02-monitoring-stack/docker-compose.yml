version: '3.8'

services:
  # Konteyner metriklerini toplayan Google cAdvisor servisi
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: mon_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - mon-net

  # Metrikleri zaman serisi olarak saklayan Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: mon_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - mon-net

  # Metrikleri görselleştiren Dashboard (Grafana)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: mon_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - mon-net

networks:
  mon-net:
    driver: bridge